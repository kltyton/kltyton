<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280" fill="none" role="img" aria-label="kltyton. Minecraft mods · Interfaces · Tools. 写 Minecraft 模组，也做 Windows 工具。"><style>:root{--ink:#f0f6fc;--muted:#9da7b3}text{font-family:'Segoe UI','Microsoft YaHei',system-ui,sans-serif;letter-spacing:0}.muted{fill:var(--muted)}.ink{fill:var(--ink)}.mono{font-family:Consolas,'Liberation Mono',monospace}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.spectrum{animation:spectrum 7s linear infinite}.scanner{animation:scan 4s ease-in-out infinite}.circuit{animation:circuit 10s linear infinite}.cursor{animation:blink 1.2s steps(1,end) infinite}@keyframes spectrum{to{transform:translateX(420px)}}@keyframes scan{0%,100%{transform:translateY(-60px);opacity:0}20%,80%{opacity:.6}90%{transform:translateY(260px);opacity:0}}@keyframes circuit{to{stroke-dashoffset:-2400}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}</style><defs><linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" x2="420" spreadMethod="repeat"><stop stop-color="#38e8ff"/><stop offset=".33" stop-color="#ff77b7"/><stop offset=".66" stop-color="#ffd064"/><stop offset="1" stop-color="#38e8ff"/></linearGradient><linearGradient id="scan"><stop stop-color="#38e8ff" stop-opacity="0"/><stop offset=".5" stop-color="#38e8ff"/><stop offset="1" stop-color="#ff77b7" stop-opacity="0"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#8192a8" stroke-opacity=".09"/></pattern><clipPath id="letters"><text x="210" y="125" text-anchor="middle" font-size="68" font-weight="800">kltyton</text></clipPath><clipPath id="frame"><rect width="420" height="280" rx="8"/></clipPath></defs>
<rect x=".5" y=".5" width="419" height="279" rx="8" fill="#0b0f16" stroke="#354050"/>
<g clip-path="url(#frame)"><rect width="420" height="280" fill="url(#grid)"/><path class="scanner" d="M0 0H420" stroke="url(#scan)" stroke-width="2"/></g>
